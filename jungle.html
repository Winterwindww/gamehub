<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斗兽棋 · 联机游戏厅</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<div class="wrap jungle-wrap">

  <div class="topbar">
    <span class="back" id="backBtn">← 返回大厅</span>
    <span class="title">斗兽棋</span>
    <span class="spacer"></span>
    <button class="sound-toggle" id="soundBtn" type="button"></button>
    <button class="chat-open" id="chatOpenBtn" type="button" title="房间公聊">
      <span class="chat-open-ico">💬</span><span class="chat-open-txt">公聊</span>
      <span class="chat-open-badge hidden" id="chatBadge">0</span>
    </button>
    <span class="room-badge" id="roomBadge" title="点击复制邀请链接">
      <span class="conn-dot" id="connDot"></span>
      房间 <span class="code" id="roomCode">----</span>
    </span>
  </div>

  <div class="card">
    <div class="seat-list" id="seatList">
      <div class="empty-tip">正在进入房间…</div>
    </div>
  </div>

  <div class="card board-stage" style="margin-top:16px">
    <div class="turn-bar" id="turnBar"></div>
    <div class="jungle-holder">
      <div class="jungle-board" id="board"></div>
    </div>
    <div class="jungle-legend" id="legend"></div>
    <div class="btn-row" style="margin-top:18px;width:100%;max-width:760px">
      <button class="btn" id="undoBtn" disabled>悔棋</button>
      <button class="btn btn-danger" id="resignBtn" disabled>认输</button>
      <button class="btn btn-gold" id="rematchBtn" disabled>再来一局</button>
    </div>
    <div class="hint" style="margin-top:6px;font-size:12px;opacity:.75">悔棋 = 收回自己刚走的那一步，对手应招后就收不回来了</div>
    <div class="waiting-note" id="bottomNote" style="width:100%;max-width:760px"></div>
  </div>

</div>

<script src="js/util.js?v=15"></script>
<script src="js/sound.js?v=15"></script>
<script src="js/cloud.js?v=15"></script>
<script src="js/jungle-engine.js?v=15"></script>
<script src="js/jungle.js?v=15"></script>
<script src="js/chat.js?v=15"></script>
</body>
</html>
