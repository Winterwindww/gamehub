<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖鞋幸存者 · Slipper Survivor</title>
<style>
  :root{
    --ink:#2b1e3d;
    --cream:#fff6e6;
    --pink:#ff8fb0;
    --mint:#8ee6b3;
    --yellow:#ffd166;
    --violet:#a78bfa;
    --sky:#7ce3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;margin:0;overflow:hidden;
    background:
      radial-gradient(circle at 50% 0%, #46325f 0%, #2a1c3e 45%, #150f21 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    color:#fff;
  }
  #stage{
    position:relative;
    background:#7ecb5c;
    box-shadow:0 0 0 4px #120c1c, 0 0 0 8px #453064, 0 24px 60px rgba(0,0,0,.65);
    overflow:hidden;
    border-radius:3px;
    --u:3px;
  }
  #game{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }

  /* ---------------- HUD ---------------- */
  #lowhp{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 calc(var(--u)*14) calc(var(--u)*3) rgba(255,60,80,.55);transition:opacity .25s}
  #lowhp.on{opacity:1;animation:lowpulse 1.1s ease-in-out infinite}
  @keyframes lowpulse{0%,100%{opacity:.45}50%{opacity:.95}}
  #hud{position:absolute;inset:0;pointer-events:none;user-select:none}
  #hud.hidden{display:none}

  #xpwrap{
    position:absolute;left:0;right:0;top:0;height:calc(var(--u)*3.6);
    background:rgba(24,14,36,.78);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.18);
  }
  #xpfill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#5fd8ff,#a78bfa 60%,#ff9de2);
    box-shadow:0 0 8px rgba(140,220,255,.65);
  }

  #topbar{
    position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:calc(var(--u)*4.4);
    display:flex;align-items:center;gap:calc(var(--u)*4);
  }
  #hpbox{
    display:flex;align-items:center;gap:calc(var(--u)*2);
    background:rgba(24,14,36,.55);
    padding:calc(var(--u)*1.4) calc(var(--u)*2.6) calc(var(--u)*1.4) calc(var(--u)*1.6);
    border-radius:calc(var(--u)*2);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  #hpbox .heart{color:#ff6b8f;font-size:calc(var(--u)*5.4);line-height:1;text-shadow:0 0 6px rgba(255,90,130,.6)}
  #hpbar{
    width:calc(var(--u)*38);height:calc(var(--u)*4.2);
    background:rgba(0,0,0,.45);border-radius:calc(var(--u)*1);
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  #hpfill{
    height:100%;width:100%;
    background:linear-gradient(90deg,#ff5f7e,#ff9f6e);
    box-shadow:0 0 6px rgba(255,90,120,.55);
    transition:width .12s ease-out;
  }
  #hptext{
    font-size:calc(var(--u)*3.6);font-weight:700;letter-spacing:.5px;
    color:#ffe9ef;font-variant-numeric:tabular-nums;min-width:calc(var(--u)*18);
  }
  #timer{
    margin-left:auto;font-size:calc(var(--u)*6);font-weight:800;
    letter-spacing:calc(var(--u)*.4);
    text-shadow:0 calc(var(--u)*.7) 0 #1c1129, 0 0 10px rgba(255,209,102,.35);
    color:#fff3d6;font-variant-numeric:tabular-nums;
  }
  #killbox{
    display:flex;align-items:center;gap:calc(var(--u)*1.4);
    background:rgba(24,14,36,.55);
    padding:calc(var(--u)*1.4) calc(var(--u)*2.6);
    border-radius:calc(var(--u)*2);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    font-size:calc(var(--u)*3.8);font-weight:800;color:#ffe9c4;
    font-variant-numeric:tabular-nums;
  }
  #killbox .skull{color:#ffb0c4;font-size:calc(var(--u)*4.2);line-height:1}
  #killbox.pop{animation:killpop .22s ease-out}
  @keyframes killpop{
    0%{transform:scale(1)}
    35%{transform:scale(1.13);box-shadow:inset 0 0 0 1px rgba(255,209,102,.9),0 0 calc(var(--u)*3) rgba(255,209,102,.55)}
    100%{transform:scale(1)}
  }
  #lvbox{
    background:linear-gradient(180deg,#ffd166,#ffb347);
    color:#4a2d0c;font-weight:800;
    font-size:calc(var(--u)*3.8);
    padding:calc(var(--u)*1.4) calc(var(--u)*3);
    border-radius:calc(var(--u)*1.6);
    box-shadow:0 calc(var(--u)*.9) 0 #b9772a;
    letter-spacing:.5px;
  }

  #invbar{
    position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*4);
    display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);
    max-width:calc(var(--u)*300);
  }
  .slot{
    position:relative;
    width:calc(var(--u)*11.5);height:calc(var(--u)*11.5);
    background:rgba(28,17,42,.72);
    border-radius:calc(var(--u)*1.6);
    box-shadow:inset 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
  }
  .slot canvas{width:calc(var(--u)*9);height:calc(var(--u)*9);image-rendering:pixelated}
  .slot .lvc{
    position:absolute;right:calc(var(--u)*.4);bottom:calc(var(--u)*.1);
    font-size:calc(var(--u)*2.8);font-weight:800;color:#ffe9a8;
    text-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.7);
  }
  .slot.w{box-shadow:inset 0 0 0 calc(var(--u)*.6) rgba(255,209,102,.55)}
  .slot.p{box-shadow:inset 0 0 0 calc(var(--u)*.6) rgba(124,227,255,.5)}

  #mutebtn, #pausebtn{
    position:absolute;bottom:calc(var(--u)*4);
    width:calc(var(--u)*11);height:calc(var(--u)*11);
    border:0;border-radius:calc(var(--u)*1.8);
    background:rgba(28,17,42,.8);
    color:#ffe9a8;font-size:calc(var(--u)*4.6);font-weight:800;
    cursor:pointer;pointer-events:auto;
    box-shadow:inset 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.2);
    opacity:.75;transition:opacity .15s,transform .15s;
  }
  #pausebtn{right:calc(var(--u)*4)}
  #mutebtn{right:calc(var(--u)*17);font-size:calc(var(--u)*4.2);line-height:1}
  #mutebtn:hover, #pausebtn:hover{opacity:1;transform:scale(1.06)}
  #mutebtn.off{opacity:.42}

  #toast{
    position:absolute;left:0;right:0;top:22%;
    text-align:center;font-size:calc(var(--u)*8);font-weight:800;
    color:#ffd166;letter-spacing:2px;
    text-shadow:0 calc(var(--u)*.8) 0 #5a2c00, 0 0 18px rgba(255,160,60,.8);
    opacity:0;transition:opacity .3s;
  }
  #toast.show{opacity:1;animation:toastPop .5s ease-out}
  /* toast 要能盖在升级遮罩上面，否则融合/进化提示全被挡住 */
  #toast{z-index:36}

  /* 融合横幅：显示在升级遮罩之上，不挡卡片点击 */
  #fusepop{
    position:absolute;left:50%;bottom:calc(var(--u)*6);
    transform:translateX(-50%);
    z-index:39;pointer-events:none;
    width:calc(var(--u)*210);max-width:92%;
    padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*3.4);
    border-radius:calc(var(--u)*2.2);
    background:linear-gradient(180deg, rgba(66,38,102,.97), rgba(34,19,52,.97));
    box-shadow:
      0 0 0 calc(var(--u)*.7) #ffd166,
      0 0 0 calc(var(--u)*2.2) rgba(0,0,0,.6),
      0 0 calc(var(--u)*22) rgba(255,190,70,.55);
    text-align:center;
  }
  #fusepop.hidden{display:none}
  #fusepop.pop{animation:fpIn .38s cubic-bezier(.2,1.7,.4,1)}
  @keyframes fpIn{0%{transform:translateX(-50%) scale(.55);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
  #fpTitle{
    font-size:calc(var(--u)*5.4);font-weight:900;color:#ffe066;letter-spacing:1px;
    text-shadow:0 calc(var(--u)*.8) 0 #6b3a00;
  }
  #fpFrom{font-size:calc(var(--u)*3.2);color:#ffd9a0;margin-top:calc(var(--u)*.8);font-weight:700}
  #fpEff{
    margin-top:calc(var(--u)*1.8);padding-top:calc(var(--u)*1.8);
    border-top:calc(var(--u)*.3) dashed rgba(255,209,102,.45);
    display:flex;flex-direction:column;gap:calc(var(--u)*.9);
  }
  #fpEff .fp-eff{font-size:calc(var(--u)*3.2);color:#efe2ff;line-height:1.5;text-align:left}
  #fpEff .fp-eff b{color:#7ef0c0;font-weight:800}
  @keyframes toastPop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* ---------------- overlays ---------------- */
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:calc(var(--u)*5);
    background:rgba(18,10,28,.86);
    z-index:10;padding:calc(var(--u)*6);
  }
  .overlay.hidden{display:none}

  /* title */
  #title{background:linear-gradient(180deg, rgba(18,10,30,.9) 0%, rgba(18,10,30,.9) 52%, rgba(18,10,30,.12) 100%)}
  .game-title{
    margin:0;font-size:calc(var(--u)*17);line-height:1;
    font-weight:900;letter-spacing:calc(var(--u)*1.2);
    color:#fff4d8;
    text-shadow:
      0 calc(var(--u)*1.2) 0 #6b3aa0,
      0 calc(var(--u)*2.4) 0 #3f2064,
      0 calc(var(--u)*3.6) 0 #241038,
      0 0 calc(var(--u)*12) rgba(255,180,120,.45);
  }
  .game-sub{
    font-size:calc(var(--u)*4);letter-spacing:calc(var(--u)*1.6);
    color:#c8b3ff;text-transform:uppercase;font-weight:700;opacity:.9;
  }
  .bigbtn{
    position:relative;border:0;cursor:pointer;
    font-family:inherit;font-weight:900;
    font-size:calc(var(--u)*6.4);letter-spacing:calc(var(--u)*.8);
    color:#4a2410;
    padding:calc(var(--u)*3.4) calc(var(--u)*13);
    background:linear-gradient(180deg,#ffd977,#ffab3d);
    border-radius:calc(var(--u)*2.4);
    box-shadow:
      0 calc(var(--u)*1.6) 0 #b96a1c,
      0 calc(var(--u)*2.6) 0 #7d4413,
      0 calc(var(--u)*4) calc(var(--u)*8) rgba(255,140,60,.35),
      inset 0 calc(var(--u)*.8) 0 rgba(255,255,255,.55);
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .bigbtn:hover{filter:brightness(1.07)}
  .bigbtn:active{transform:translateY(calc(var(--u)*1.6));box-shadow:0 0 0 #b96a1c,0 calc(var(--u)*1) 0 #7d4413}
  .howto{font-size:calc(var(--u)*3.8);color:#d8cbe8;line-height:1.9;text-align:center}
  .howto b{color:#ffd166;font-weight:800}
  .bestline{font-size:calc(var(--u)*4.4);color:#ffb3c7;font-weight:800;letter-spacing:1px}
  .bestline span{color:#fff;}

  /* level up */
  #levelup{background:rgba(18,10,30,.72)}
  .lv-head{
    font-size:calc(var(--u)*8);font-weight:900;color:#ffe9a8;letter-spacing:2px;
    text-shadow:0 calc(var(--u)*.8) 0 #5b2f7a, 0 0 calc(var(--u)*14) rgba(255,210,110,.6);
    animation:headPulse 1.2s ease-in-out infinite;
  }
  @keyframes headPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .cards{display:flex;gap:calc(var(--u)*6);align-items:stretch}
  .card{
    width:calc(var(--u)*54);
    background:linear-gradient(180deg,#3a2a52,#2a1c3c);
    border-radius:calc(var(--u)*2);
    padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*3.4);
    text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4);
    box-shadow:
      0 0 0 calc(var(--u)*1) var(--cc,#ffd166),
      0 0 0 calc(var(--u)*2.6) rgba(0,0,0,.55),
      0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.5);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*1.4);
    background:var(--cc,#ffd166);opacity:.9;
  }
  .card:hover{
    transform:translateY(calc(var(--u)*-2.2)) scale(1.035);
    box-shadow:
      0 0 0 calc(var(--u)*1) var(--cc,#ffd166),
      0 0 0 calc(var(--u)*2.6) rgba(0,0,0,.55),
      0 0 calc(var(--u)*16) var(--cc,#ffd166),
      0 calc(var(--u)*3) calc(var(--u)*8) rgba(0,0,0,.55);
    filter:brightness(1.08);
  }
  .c-tag{
    font-size:calc(var(--u)*3);font-weight:800;letter-spacing:1.5px;
    padding:calc(var(--u)*.6) calc(var(--u)*2.4);border-radius:99px;
    background:color-mix(in srgb, var(--cc) 26%, transparent);
    color:var(--cc);margin-top:calc(var(--u)*1);
  }
  .c-icon{
    width:calc(var(--u)*18);height:calc(var(--u)*18);image-rendering:pixelated;
    margin:calc(var(--u)*1.4) 0;
    filter:drop-shadow(0 calc(var(--u)*1.2) calc(var(--u)*1.4) rgba(0,0,0,.5));
  }
  .c-name{font-size:calc(var(--u)*5);font-weight:900;color:#fff5e2;letter-spacing:.5px}
  .c-lv{font-size:calc(var(--u)*3.2);font-weight:800;color:var(--cc);letter-spacing:.5px}
  .c-desc{font-size:calc(var(--u)*3.3);color:#d5c8e8;line-height:1.6;min-height:calc(var(--u)*7)}
  #comboTip{color:#ffd166;margin-bottom:calc(var(--u)*1.2);font-size:calc(var(--u)*3.2);max-width:calc(var(--u)*200);text-align:center;line-height:1.5}
  .lv-hint{font-size:calc(var(--u)*3.2);color:#a99ac2;letter-spacing:1px}

  /* pause & gameover */
  .panel{
    background:linear-gradient(180deg,#35264c,#241734);
    border-radius:calc(var(--u)*3);
    padding:calc(var(--u)*7) calc(var(--u)*9);
    box-shadow:0 0 0 calc(var(--u)*1) #6b4d97, 0 calc(var(--u)*3) calc(var(--u)*12) rgba(0,0,0,.6);
    text-align:center;max-width:88%;
  }
  .panel h2{
    margin:0 0 calc(var(--u)*4);font-size:calc(var(--u)*9);font-weight:900;
    color:#ffe9a8;letter-spacing:3px;
    text-shadow:0 calc(var(--u)*.9) 0 #5b2f7a;
  }
  .statgrid{
    display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*2) calc(var(--u)*6);
    font-size:calc(var(--u)*4);margin:0 auto calc(var(--u)*5);text-align:left;
    width:calc(var(--u)*180);max-width:100%;
  }
  .statgrid .k{color:#a99ac2;font-weight:700}
  .statgrid .v{color:#fff;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
  .statgrid .v.hi{color:#ffd166}
  .upline{display:flex;gap:calc(var(--u)*1.4);justify-content:center;flex-wrap:wrap;margin-bottom:calc(var(--u)*4);max-width:calc(var(--u)*230)}
  .dmgrank{width:calc(var(--u)*190);max-width:100%;margin:0 auto calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
  .dmghd{font-size:calc(var(--u)*3);color:#a99ac2;font-weight:900;text-align:left;margin-bottom:calc(var(--u)*.4);letter-spacing:.05em}
  .dmgrow{display:flex;align-items:center;gap:calc(var(--u)*1.6);font-size:calc(var(--u)*3)}
  .dmgn{width:calc(var(--u)*34);flex:none;font-weight:900;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dmgtrack{flex:1;height:calc(var(--u)*1.8);background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);border-radius:999px;overflow:hidden}
  .dmgtrack i{display:block;height:100%;border-radius:999px;box-shadow:0 0 6px currentColor}
  .dmgv{width:calc(var(--u)*42);flex:none;text-align:right;color:#fff;font-weight:900;font-variant-numeric:tabular-nums}
  .dmgv em{font-style:normal;font-weight:700;color:#a99ac2;font-size:.82em;margin-left:calc(var(--u)*.6)}
  .mini{
    display:flex;align-items:center;gap:calc(var(--u)*1.2);
    background:rgba(255,255,255,.07);border-radius:calc(var(--u)*1.4);
    padding:calc(var(--u)*.8) calc(var(--u)*2);
    font-size:calc(var(--u)*3.2);color:#e6dcf5;font-weight:700;
  }
  .mini canvas{width:calc(var(--u)*6);height:calc(var(--u)*6);image-rendering:pixelated}
  .mini i{font-style:normal;color:#ffd166}
  #gameover{background:radial-gradient(circle at 50% 45%, rgba(90,30,50,.6), rgba(14,8,20,.94))}
  #gameover h2{color:#ff9fb6;text-shadow:0 calc(var(--u)*.9) 0 #59153a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="lowhp"></div>

  <div id="hud" class="hidden">
    <div id="xpwrap"><div id="xpfill"></div></div>
    <div id="topbar">
      <div id="hpbox">
        <span class="heart">♥</span>
        <div id="hpbar"><div id="hpfill"></div></div>
        <span id="hptext">100/100</span>
      </div>
      <div id="killbox"><span class="skull">☠</span><span id="killnum">0</span></div>
      <div id="timer">00:00</div>
      <div id="lvbox">Lv.1</div>
    </div>
    <div id="invbar"></div>
    <button id="mutebtn" title="静音 (M)">🔊</button>
    <button id="pausebtn" title="暂停 (ESC)">❚❚</button>
    <div id="toast"></div>
    <div id="fusepop" class="hidden">
      <div id="fpTitle"></div>
      <div id="fpFrom"></div>
      <div id="fpEff"></div>
    </div>
  </div>

  <div id="title" class="overlay">
    <h1 class="game-title">拖鞋幸存者</h1>
    <div class="game-sub">SLIPPER SURVIVOR</div>
    <button class="bigbtn" id="startBtn">开 始 游 戏</button>
    <div class="howto">
      <b>WASD / 方向键</b> 移动 · 武器<b>自动攻击</b><br>
      走近<b>经验宝石</b>才会升级 · 武器升到 <b>Lv.5</b> 会进化<br>
      凑齐<b>指定的一对武器</b>会当场<b>融合</b>成一把（同时释放两套攻击，还腾出一个武器位）<br>
      站进怪堆会<b>持续掉血</b> · <b>1 / 2 / 3</b> 选强化 · <b>ESC</b> 暂停 · <b>M</b> 静音
    </div>
    <div class="bestline">最高生存纪录：<span id="bestT">0:00</span></div>
  </div>

  <div id="levelup" class="overlay hidden">
    <div class="lv-head">⚡ 升级！</div>
    <div class="cards" id="cards"></div>
    <div class="lv-hint" id="comboTip"></div>
    <div class="lv-hint">按 1 / 2 / 3 或点击卡片</div>
  </div>

  <div id="pausebox" class="overlay hidden">
    <div class="panel">
      <h2>暂 停</h2>
      <div class="upline" id="pauseUp"></div>
      <div class="statgrid" id="pauseStats"></div>
      <button class="bigbtn" id="resumeBtn">继 续</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <h2>你被吃掉了…</h2>
      <div class="statgrid" id="goStats"></div>
      <div class="upline" id="goUp"></div>
      <div class="dmgrank" id="goDmg"></div>
      <button class="bigbtn" id="restartBtn">再 来 一 局</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = id => document.getElementById(id);
const stage = $('stage');
const cvs = $('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 640, H = 360;
const ARENA = { w: 1720, h: 1000 };

const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const pickOne = a => a[Math.floor(Math.random() * a.length)];

function dist(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return Math.sqrt(dx*dx + dy*dy); }

/* =========================================================
   1. 像素精灵
   ========================================================= */
function makeSprite(rows, pal){
  const h = rows.length;
  const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for(let y = 0; y < h; y++){
    const row = rows[y];
    const off = Math.floor((w - row.length) / 2);
    for(let x = 0; x < row.length; x++){
      const col = pal[row[x]];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x + off, y, 1, 1);
    }
  }
  return c;
}
function whiteOf(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function reg(rows, pal){
  const img = makeSprite(rows, pal);
  return { img, white: whiteOf(img), w: img.width, h: img.height };
}

/* =========================================================
   2. 图标（16x16 程序绘制）
   ========================================================= */
function drawIcon(g, id){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0, 0, 16, 16);
  const R = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(x,y,w,h); };
  const C = (cx,cy,r,c) => {
    g.fillStyle = c;
    for(let y = -r; y <= r; y++){
      const w = Math.round(Math.sqrt(Math.max(0, r*r - y*y)));
      g.fillRect(cx - w, cy + y, w*2 + 1, 1);
    }
  };
  switch(id){
    case 'slipper':
      R(3,6,10,5,'#ff9dc0'); R(3,6,10,2,'#ffc7dc');
      R(2,10,12,3,'#fff2e2'); R(2,12,12,1,'#e8d6c4');
      R(5,8,7,1,'#e0527c');
      break;
    case 'banana':
      C(8,7,6,'#ffd83d');
      g.globalCompositeOperation = 'destination-out';
      C(9,4,5,'#000');
      g.globalCompositeOperation = 'source-over';
      C(8,11,2,'#ffd83d'); R(11,2,2,3,'#a8792a');
      break;
    case 'candy':
      R(1,7,2,3,'#ffd166'); R(13,7,2,3,'#ffd166');
      C(8,8,5,'#ff8fb0'); C(8,8,3,'#fff6e6'); C(8,8,1,'#ff8fb0');
      break;
    case 'bubble':
      C(8,8,6,'#5fd8ff'); C(8,8,4,'#9de9ff');
      C(6,6,2,'#ffffff'); R(11,11,1,1,'#ffffff');
      break;
    case 'tomato':
      C(8,9,6,'#ff5d5d'); C(7,8,2,'#ff9b9b');
      R(6,2,4,3,'#5ec95e'); R(8,3,2,1,'#3f9e3f'); R(3,4,3,2,'#5ec95e'); R(10,4,3,2,'#5ec95e');
      break;
    case 'bolt':
      R(9,1,4,2,'#ffe066'); R(7,3,4,3,'#ffe066'); R(5,6,5,3,'#ffe066');
      R(7,9,4,3,'#ffc93d'); R(9,11,3,3,'#ffc93d'); R(4,7,3,2,'#fff3a8');
      break;
    case 'heart':
      C(5,5,3,'#ff6b8f'); C(11,5,3,'#ff6b8f');
      R(3,6,11,3,'#ff6b8f'); R(4,9,9,2,'#ff6b8f'); R(5,11,7,2,'#ff6b8f');
      R(6,12,5,1,'#ff6b8f'); R(7,13,3,1,'#ff6b8f');
      C(5,4,1,'#ffc2d1');
      break;
    case 'shoe':
      R(4,5,6,6,'#8ee06e'); R(3,10,11,3,'#7bcf5e');
      R(2,13,12,2,'#fff6e6'); R(5,7,4,1,'#e8fbe0');
      break;
    case 'sauce':
      R(6,1,4,2,'#3a2b3f'); R(5,3,6,2,'#ff5c3d');
      R(6,5,4,8,'#ff5c3d'); R(7,6,2,6,'#ff8a5c');
      R(5,13,6,2,'#c73d22');
      break;
    case 'lens':
      C(7,7,6,'#bfe9ff'); C(7,7,4,'#e8fbff'); C(6,6,2,'#ffffff');
      R(11,11,2,2,'#8a6a4a'); R(12,13,2,2,'#6d5138');

/* 这把武器是不是已经被吃进某把融合武器里了（返回融合武器 id） */
function fusedInto(id){
  if(!P) return null;
  for(const k in P.weapons){
    const w = WEAPONS[k];
    if(w && w.pair && w.pair.indexOf(id) >= 0) return k;
  }
  return null;
}
/* 是否拥有某把原始武器（直接拥有，或已经融合进融合武器） */
function own(id){
  if(!P) return false;
  if(P.weapons[id]) return true;
  return !!fusedInto(id);
}
/* 融合武器里对应原始武器的等效等级（给香蕉/光环这类逐帧武器用） */
function fusedLv(src){
  if(!P) return 0;
  for(const k in P.weapons){
    const w = WEAPONS[k];
    if(!w || !w.pair) continue;
    const idx = w.pair.indexOf(src);
    if(idx < 0) continue;
    const st = P.wsrc && P.wsrc[k];
    const ownLv = (st && st[idx]) ? st[idx] : 0;
    return Math.max(P.weapons[k], ownLv);
  }
  return 0;
}

/* 融合不是简单叠加：每对武器都长出一个新的结合形态 */
const FUSED_DESC = {
  zero:     '冰漩涡：吸住怪群并一直冻住，边缘不停喷冰锥',
  volt:     '电环：以自身为圆心放电，命中过的敌人继续向外跳',

  overload: '雷光：贯穿激光，沿线三处跟着落雷',
  combust:  '冰火双喷：红蓝交替，冻住的再吃 60% 爆伤',
  flywheel: '轨道甩糖：从旋转的香蕉轨道向外甩糖粒',
  nitro:    '抛雷：把地雷抛进怪堆，落地炸一大圈'
};

/* 生成融合武器：不同组合有各自的结合技，只占一个武器位 */
for(const cid in COMBOS){
  const c = COMBOS[cid];
  const srcs = c.need.slice();
  const fidK = 'f_' + cid;
  const base = WEAPONS[srcs[0]];
  WEAPONS[fidK] = {
    name: c.name, blurb: FUSED_DESC[cid] || c.desc,
    color: base.color, icon: base.icon, max: 5, pair: srcs,
    labels: { dmg:'威力', cd:'节奏' },
    stats: function(lv){
      let cd = 99;
      for(let i = 0; i < srcs.length; i++){
        const w = WEAPONS[srcs[i]];
        if(!w || !w.fire) continue;
        const st = w.stats(Math.min(w.max, Math.max(1, lv)));
        if(st && st.cd) cd = Math.min(cd, st.cd);
      }
      return { dmg: 0, cd: (cd === 99 ? 0.5 : cd) * 0.85 };
    },
    evo: '融合完全体：结合技再上一档',
    fire: function(lv){
      /* 结合技优先：这是融合的意义，不是两套攻击的无脑叠加 */
      const fx = FUSED_FIRE[cid];
      if(fx){ fx(lv); return; }
      /* 每把源武器按"融合前自己的等级"结算（至少等于融合等级）：
         融合只做加法，绝不把进化形态 / 成长等级吞掉 */
      const st = (P && P.wsrc) ? P.wsrc[fidK] : null;
      for(let i = 0; i < srcs.length; i++){
        const w = WEAPONS[srcs[i]];
        if(!w || !w.fire) continue;
        const ownLv = (st && st[i]) ? st[i] : 1;
        w.fire.call(w, Math.min(w.max, Math.max(1, lv, ownLv)));
      }
    }
  };
}
/* 融合武器名单（卡片/提示用） */
function fuseIdOf(a, b){
  for(const cid in COMBOS){
    const nd = COMBOS[cid].need;
    if(nd.length === 2 && nd.indexOf(a) >= 0 && nd.indexOf(b) >= 0) return 'f_' + cid;
  }
  return null;
}

/* =========================================================
   4.5 融合武器的结合技（每对武器长出的新形态）
   ========================================================= */
/* 结合技里取"源武器融合前自己的等级"，至少等于融合等级 */
function fuseSrcLv(fid, i, lv){
  const st = (P && P.wsrc) ? P.wsrc[fid] : null;
  const v = (st && st[i]) ? st[i] : 0;
  return Math.min(5, Math.max(1, lv, v));
}

function getStats(){
  const p = P ? P.passives : {};
  const lv = id => p[id] || 0;
  return {
    speed: 100 * (1 + 0.10 * lv('shoe')) * (1 - 0.12 * lv('heavy')) * (1 + 0.24 * lv('feather')),
    cdMul: Math.pow(0.91, lv('sauce')) * (1 + 0.18 * lv('dual')) * (1 - 0.25 * lv('mag')) * (1 + 0.10 * lv('lance')) * (1 + 0.12 * lv('bore')),
    area: (1 + 0.14 * lv('lens')) * (1 + 0.35 * lv('bore')),
    range: (1 + 0.15 * lv('reach')) * (1 + 0.40 * lv('lance')),
    blast: (1 + 0.14 * lv('blast')) * ((P && own('popcorn') && own('mine')) ? 1.3 : 1),
    xpMul: 1 + 0.18 * lv('clover'),
    pickup: 130 + 45 * lv('magnet'),
    dmgMul: 1.30 * (1 + 0.12 * lv('glove')) * (1 + 0.55 * lv('glass')) * (1 + 0.40 * lv('dual')) * (1 - 0.15 * lv('mag')),
    multi: lv('multi'),
    pierce: lv('pierce'),
    /* 坦度随等级成长：每级 +0.5% 减伤，上限 45% */
    armor: Math.min(0.50, 0.0058 * Math.max(0, (P ? P.level : 1) - 1) + 0.05 * lv('plate') + 0.16 * lv('heavy')),
    crit: 0.08 * lv('crit'),
    critMul: 1.6 + 0.30 * lv('critdmg'),
    dodge: Math.min(0.30, 0.08 * lv('dodge')),
    thorns: 8 * lv('thorns'),
    knock: 10 * lv('knock'),
    hitHeal: P ? P.maxHp * 0.0004 * lv('hitheal') : 0,
    luck: 1 + 0.25 * lv('luck'),
    bossMul: 1 + 0.12 * lv('bossmul'),
    vamp: P ? P.maxHp * 0.0018 * lv('vamp') : 0,
    vampCap: P ? P.maxHp * 0.013 : 0,
    regen: P ? P.maxHp * 0.0050 * lv('regen') : 0,
    chill: 0.26 * lv('chill'),
    cbZero: own('frost') && own('hole'),
    cbVolt: own('chain') && own('aura'),
    cbAmmo: own('gun') && own('slipper'),
    cbVolley: own('missile') && own('popcorn'),
    cbOverload: own('beam') && own('bolt'),
    cbCombust: own('tomato') && own('frost'),
    cbFlywheel: own('fan') && own('banana'),
    cbNitro: own('popcorn') && own('mine'),
    /* 已经融合进融合武器的原始武器名单：它们的伤害再 +25%（融合的质变） */
    fusedSrc: (function(){
      const m = {};
      if(!P) return m;
      for(const k in P.weapons){
        const w = WEAPONS[k];
        if(w && w.pair) for(let i = 0; i < w.pair.length; i++) m[w.pair[i]] = 1;
      }
      return m;
    })()
  };
}

/* 射程：基础值 → 随武器等级微涨 → 乘上射程结晶（单位 px，从玩家脚下算） */
function wRange(base, lv){
  const k = 1 + 0.045 * (Math.max(1, lv || 1) - 1);
  return base * k * ((ST && ST.range) ? ST.range : 1);
}

/* 升级所需经验：等级数刻意压得很少，一次升级要攒很久 */
function nextXp(){
  const L = P ? P.level : 1;
  const base = 24 + 15 * L + 3.5 * Math.pow(L, 1.92);
  const late = 1 + Math.max(0, L - 14) * 0.17;
  return Math.round(base * late);
}

/* 每次升级都要跑：坦度成长 + 重算属性 + 回一点血 */
function onLevel(){
  P.maxHp += 6;
  P.hp = Math.min(P.maxHp, P.hp + 6);
  ST = getStats();
}

/* 震屏节流：满屏爆炸时不至于一直抖 */
function addShake(v){
  if(state.shakeCd > 0) return;
  state.shakeCd = 0.16;
  state.shake = Math.min(5.5, Math.max(state.shake, v));
}

/* =========================================================
   7. 音频：音效总线 + 芯片音乐 BGM
   ========================================================= */
let AC = null, masterGain = null, sfxGain = null, bgmGain = null;
let muted = false, lastSfx = 0;

function audioInit(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(AC.destination);

    sfxGain = AC.createGain();
    sfxGain.gain.value = 1;
    sfxGain.connect(masterGain);

    bgmGain = AC.createGain();
    bgmGain.gain.value = 0.0001;
    bgmGain.connect(masterGain);
  }catch(e){ AC = null; }
  return AC;
}

function sfx(type){
  if(muted) return;
  const now = performance.now();
  if(now - lastSfx < 22) return;
  if(!audioInit()) return;
  try{
    if(AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(sfxGain);
    let f0 = 440, f1 = 660, dur = 0.08, vol = 0.035, wave = 'square';
    switch(type){
      case 'shoot':  f0 = 620; f1 = 380; dur = 0.05; vol = 0.018; wave = 'square'; break;
      case 'pop':    f0 = 700; f1 = 1100; dur = 0.06; vol = 0.02; break;
      case 'splat':  f0 = 300; f1 = 160; dur = 0.07; vol = 0.022; wave = 'sawtooth'; break;
      case 'bubble': f0 = 420; f1 = 900; dur = 0.14; vol = 0.025; wave = 'sine'; break;
      case 'zap':    f0 = 1200; f1 = 200; dur = 0.1; vol = 0.022; wave = 'sawtooth'; break;
      case 'hit':    f0 = 240; f1 = 150; dur = 0.05; vol = 0.02; wave = 'square'; break;
      case 'kill':   f0 = 520; f1 = 240; dur = 0.07; vol = 0.02; break;
      case 'gem':    f0 = 880; f1 = 1320; dur = 0.05; vol = 0.014; wave = 'sine'; break;
      case 'level':  f0 = 520; f1 = 1040; dur = 0.25; vol = 0.035; wave = 'triangle'; break;
      case 'hurt':   f0 = 180; f1 = 90; dur = 0.16; vol = 0.05; wave = 'sawtooth'; break;
      case 'boss':   f0 = 120; f1 = 60; dur = 0.5; vol = 0.06; wave = 'sawtooth'; break;
      case 'over':   f0 = 400; f1 = 60; dur = 0.7; vol = 0.05; wave = 'triangle'; break;
    }
    o.type = wave;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
    lastSfx = now;
  }catch(e){ /* 忽略音频错误 */ }
}

/* --- 芯片音乐：C 大调 I–V–vi–IV 琶音循环，轻快小跳跃 --- */
const BGM = {
  bpm: 146,
  step: 0,
  next: 0,
  timer: null,
  on: false,
  /* 每个和弦 8 个八分音符，共 4 小节（32 步） */
  chords: [
    [60, 64, 67, 72],
    [55, 59, 62, 67],
    [57, 60, 64, 69],
    [53, 57, 60, 65]
  ],
  leadPat: [0, 1, 2, 3, 2, 3, 1, 2],
  vol: 0.22
};

function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }

function bgmTone(freq, when, dur, wave, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave;
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bgmGain);
  o.start(when); o.stop(when + dur + 0.03);
}

function bgmNoise(when, dur, vol, hp){
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 6500;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(bgmGain);
  src.start(when);
}

function bgmSchedule(){
  if(!AC || !BGM.on) return;
  const now = AC.currentTime;
  if(BGM.next < now - 0.35) BGM.next = now + 0.05;
  const eighth = 60 / BGM.bpm / 2;
  let guard = 0;
  while(BGM.next < now + 0.18 && guard++ < 12){
    const s = BGM.step;
    const bar = Math.floor(s / 8) % 4;
    const i = s % 8;
    const ch = BGM.chords[bar];
    const vol = BGM.vol;

    /* 低音：根音 + 五度 */
    if(i === 0 || i === 4) bgmTone(mtof(ch[0] - 24), BGM.next, eighth * 1.6, 'triangle', vol * 1.5);
    if(i === 3 || i === 7) bgmTone(mtof(ch[0] - 17), BGM.next, eighth * 0.6, 'triangle', vol * 0.9);
    /* 主旋律琶音 */
    const note = ch[BGM.leadPat[i]] + (i === 7 && bar % 2 === 1 ? 12 : 0);
    bgmTone(mtof(note), BGM.next, eighth * 1.3, 'square', vol * 0.62);
    /* 高音装饰 */
    if(i === 0) bgmTone(mtof(ch[3] + 12), BGM.next, eighth * 0.85, 'triangle', vol * 0.34);
    if(i === 5 && bar === 3) bgmTone(mtof(ch[3] + 7), BGM.next, eighth * 0.5, 'square', vol * 0.3);
    /* 打击 */
    bgmNoise(BGM.next, 0.03, vol * 0.24);
    if(i === 2 || i === 6) bgmNoise(BGM.next, 0.07, vol * 0.5, 3200);
    if(i === 0 || i === 4){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, BGM.next);
      o.frequency.exponentialRampToValueAtTime(46, BGM.next + 0.1);
      g.gain.setValueAtTime(vol * 1.6, BGM.next);
      g.gain.exponentialRampToValueAtTime(0.0001, BGM.next + 0.12);
      o.connect(g); g.connect(bgmGain);
      o.start(BGM.next); o.stop(BGM.next + 0.14);
    }

    BGM.next += eighth;
    BGM.step = (BGM.step + 1) % 32;
  }
}

function bgmStart(){
  if(!audioInit()) return;
  if(AC.state === 'suspended') AC.resume();
  BGM.on = true;
  BGM.step = 0;
  BGM.next = AC.currentTime + 0.08;
  if(!BGM.timer) BGM.timer = setInterval(bgmSchedule, 40);
  bgmGain.gain.cancelScheduledValues(AC.currentTime);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), AC.currentTime);
  bgmGain.gain.linearRampToValueAtTime(BGM.vol, AC.currentTime + 0.8);
}

function bgmDuck(v){
  if(!AC) return;
  const t = AC.currentTime;
  bgmGain.gain.cancelScheduledValues(t);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), t);
  bgmGain.gain.linearRampToValueAtTime(v, t + 0.2);
}

function bgmStop(){
  if(!AC) return;
  BGM.on = false;
  const t = AC.currentTime;
  bgmGain.gain.cancelScheduledValues(t);
  bgmGain.gain.setValueAtTime(Math.max(0.0001, bgmGain.gain.value), t);
  bgmGain.gain.linearRampToValueAtTime(0.0001, t + 0.35);
}

function burst(x, y, color, n, spd, gravity){
  const max = 420;
  for(let i = 0; i < n && parts.length < max; i++){
    const a = rand(0, TAU), s = rand(20, spd || 90);
    parts.push({

      life: rand(0.16, 0.42), max: 0.42, col: color,
      size: Math.random() < 0.32 ? 3 : (Math.random() < 0.5 ? 2 : 1),
      g: gravity === undefined ? 1 : gravity
    });
  }
}
function addText(x, y, v, col, size){
  if(texts.length > 30) return;
  texts.push({ x, y, v, life: 0.7, max: 0.7, col, size: size || 8 });
}

/* =========================================================
   9. 战斗逻辑
   ========================================================= */
function nearestEnemy(x, y, maxD, skipId){
  let best = null, bd = (maxD || 1e9) ** 2;
  let bigBest = null, bigD = bd;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead || (skipId !== undefined && e.id === skipId)) continue;
    const dx = e.x - x, dy = e.y - y, d = dx*dx + dy*dy;
    if(e.big){
      /* Boss / 精英优先：不然杂兵永远站在更近的位置，Boss 一点伤害都吃不到 */
      if(d < bigD){ bigD = d; bigBest = e; }
    } else if(d < bd){
      bd = d; best = e;
    }
  }
  return bigBest || best;
}

/* 优先锁定 Boss / 精英（单体武器用：杂兵再多也别把伤害全吃掉） */
function nearestBig(x, y, maxD){
  let best = null, bd = (maxD || 1e9) ** 2;
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead || !e.big) continue;
    const dx = e.x - x, dy = e.y - y, d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}

/* 通用爆炸：范围伤害 + 冲击波 + 震屏 */
function explode(x, y, r, dmg, col, light, src){
  const col2 = col || '#ffd166';
  const prevSrc = SRC;
  if(src) SRC = src;
  r *= ST.blast;
  if(rings.length < 22){
    rings.push({ x, y, r0: r * 0.22, r1: r * 1.1, life: 0.22, max: 0.22, col: col2, w: light ? 2 : 4 });
    if(!light) rings.push({ x, y, r0: r * 0.5, r1: r * 1.3, life: 0.24, max: 0.24, col: '#ffcf7a', w: 1.5 });
  }
  burst(x, y, col2, light ? 6 : 14, light ? 110 : 180);
  if(!light) addShake(2.2);
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    if(dist(x, y, e.x, e.y) < r + e.r) hurt(e, dmg);
  }
  SRC = prevSrc;
}

function bubbleBoom(px, py, R0, dmg, src){
  const prevSrc = SRC;
  if(src) SRC = src;
  R0 *= ST.blast;
  if(rings.length < 26) rings.push({ x:px, y:py, r0:R0*0.3, r1:R0, life:0.26, max:0.26, col:'#9de9ff', w:3 });
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    const d = dist(px, py, e.x, e.y);
    if(d < R0 + e.r){
      hurt(e, dmg);
      if(!e.dead){
        const a = Math.atan2(e.y - py, e.x - px) || 0;
        e.x += Math.cos(a) * (e.big ? 6 : 13);
        e.y += Math.sin(a) * (e.big ? 6 : 13);
      }
    }
  }
  burst(px, py, '#9de9ff', 12, 130);
  SRC = prevSrc;
}

function hurt(e, base){
  if(e.dead) return;
  let dmg = base * ST.dmgMul;
  if(ST.fusedSrc && ST.fusedSrc[SRC]) dmg *= 1.25;
  if(e.big && ST.bossMul > 1) dmg *= ST.bossMul;
  let crit = false;
  if(ST.crit > 0 && Math.random() < ST.crit){ dmg *= ST.critMul; crit = true; }
  if(ST.cbCombust && e.slowT > 0) dmg *= 1.6;
  DMG[SRC] = (DMG[SRC] || 0) + Math.min(dmg, Math.max(0, e.hp));
  e.hp -= dmg;
  e.flash = 0.07;
  e.hitT = 0.1;
  if(ST.chill && !e.big && Math.random() < ST.chill) e.slowT = Math.max(e.slowT || 0, 1.3);
  if(crit) addText(e.x + rand(-4, 4), e.y - e.r - 8, '暴击 ' + Math.round(dmg), '#ffd166', 9);
  else if(dmg > 220 || (e.big && dmg > 60)) addText(e.x + rand(-3, 3), e.y - e.r - 4, Math.round(dmg), '#fff3c4', 8);
  /* 命中回血：和吸血共用每秒回复预算，防止逆天 */
  if(ST.hitHeal > 0 && P.hp < P.maxHp && state.healBudget > 0){
    const h = Math.min(ST.hitHeal, state.healBudget);
    P.hp = Math.min(P.maxHp, P.hp + h);
    state.healBudget -= h;
  }
  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  state.kills++;

  /* 吸血：按最大生命百分比，且有每秒回复预算 */
  if(ST.vamp > 0 && P.hp < P.maxHp && state.healBudget >= ST.vamp){
    P.hp = Math.min(P.maxHp, P.hp + ST.vamp);
    state.healBudget -= ST.vamp;
  }

  if(e.big){
    burst(e.x, e.y, e.col, 52, 250);
    rings.push({ x:e.x, y:e.y, r0:e.r, r1:110, life:0.6, max:0.6, col:e.col, w:5 });
    rings.push({ x:e.x, y:e.y, r0:e.r, r1:150, life:0.85, max:0.85, col:'#ffffff', w:2 });
    state.shake = 9;
    state.slow = 0.25;
    state.flash = 0.3;
    sfx('boss');
    for(let i = 0; i < 10; i++) dropGem(e.x + rand(-30, 30), e.y + rand(-26, 26), 6);
    for(let i = 0; i < 3; i++) dropHeal(e.x + rand(-34, 34), e.y + rand(-28, 28), 0.3);
    /* 打完 Boss 直接送一级 */
    addText(e.x, e.y - 34, 'BOSS 击破！', '#ffe066', 14);
    forceLevelUp();
  } else {
    burst(e.x, e.y, e.col, 10, 135);
    rings.push({ x:e.x, y:e.y, r0:e.r*0.7, r1:e.r*3.2, life:0.26, max:0.26, col:e.col, w:2 });
    dropGem(e.x, e.y, e.xp);
    sfx('kill');
    if(e.type === 'pudding'){
      for(let i = 0; i < 3; i++) spawnMini(e.x + rand(-16, 16), e.y + rand(-16, 16));
    }
    if(e.poison) addHazard(e.x, e.y, 30, 5.5, Math.max(6, e.dmg * 0.5));
    if(Math.random() < 0.03 * (ST.luck || 1)) dropHeal(e.x, e.y, 0.18);
  }
}

function forceLevelUp(){
  P.level++;
  onLevel();
  P.xp = 0;
  P.xpNext = nextXp();
  state.pending++;
  if(state.mode === 'playing') showLevelUp();
}

/* 经验宝石：不会自动收走、也不会自己消失。只在同一片区域直接合并成一颗更大的，避免地面堆成一坨 */
function dropGem(x, y, val){
  for(let i = 0; i < gems.length; i++){
    const g = gems[i];
    if(Math.abs(g.x - x) < 26 && Math.abs(g.y - y) < 26){
      g.val += val;
      g.col = g.val >= 4 ? '#ffd166' : (g.val >= 2 ? '#a0ffb0' : '#7df9ff');
      return;
    }
  }
  if(gems.length > 900){
    let old = gems.shift();
    let best = -1, bd = 1e18;
    for(let i = 0; i < gems.length; i += 3){
      const d = (gems[i].x - old.x) ** 2 + (gems[i].y - old.y) ** 2;
      if(d < bd){ bd = d; best = i; }
    }
    if(best >= 0) gems[best].val += old.val;
    else val += old.val;
  }
  const col = val >= 4 ? '#ffd166' : (val >= 2 ? '#a0ffb0' : '#7df9ff');
  gems.push({
    x, y, val, col,
    vx: rand(-30, 30), vy: rand(-30, 30),
    seed: rand(0, 10), life: 0
  });
}

function dropHeal(x, y, ratio){
  if(drops.length >= 6) return;
  drops.push({ x, y, kind:'hp', val: ratio, seed: rand(0, 10), life: 0, vx: rand(-14, 14), vy: rand(-14, 14) });
}

function gainXp(n){
  P.xp += n * ST.xpMul;
  while(P.xp >= P.xpNext){
    P.xp -= P.xpNext;
    P.level++;
    onLevel();
    P.xpNext = nextXp();
    state.pending++;
  }
  if(state.pending > 0 && state.mode === 'playing') showLevelUp();
}

function hurtPlayer(d){
  if(P.invuln > 0 || state.mode !== 'playing') return;
  if(ST.dodge > 0 && Math.random() < ST.dodge){
    P.invuln = 0.22;
    addText(P.x, P.y - 26, '闪避', '#a6ffcb', 11);
    return;
  }
  const real = d * (1 - (ST.armor || 0));
  P.hp -= real;
  P.invuln = 0.55;
  state.shake = Math.max(state.shake, 4.5);
  state.hurtFlash = 0.36;
  burst(P.x, P.y, '#ff6b8f', 10, 120);
  sfx('hurt');
  if(P.hp <= 0){
    P.hp = 0;
    gameOver();
  }
}

/* =========================================================
   10. 生成敌人
   ========================================================= */
function pickType(){
  const t = state.time;
  const bag = [['slime', 34]];
  if(t > 18) bag.push(['carrot', 24]);
  if(t > 38) bag.push(['bat', 20]);
  if(t > 55) bag.push(['shooter', 11]);
  if(t > 70) bag.push(['bomb', 14]);
  if(t > 85) bag.push(['pudding', 15]);
  if(t > 100) bag.push(['burger', 13]);
  if(t > 115) bag.push(['ghost', 12]);
  if(t > 130) bag.push(['frog', 15]);
  if(t > 148) bag.push(['bee', 14]);
  if(t > 165) bag.push(['mushroom', 13]);
  if(t > 195) bag.push(['iron', 9]);
  if(t > 215) bag.push(['ant', 13]);
  let total = 0;
  for(const b of bag) total += b[1];
  let r = Math.random() * total;
  for(const b of bag){
    r -= b[1];
    if(r <= 0) return b[0];
  }
  return 'slime';
}

function spawnPoint(){
  for(let i = 0; i < 26; i++){
    const a = rand(0, TAU);
    const rad = Math.max(W, H) * 0.62;
    const x = P.x + Math.cos(a) * rad;
    const y = P.y + Math.sin(a) * rad;
    if(x < 26 || y < 26 || x > ARENA.w - 26 || y > ARENA.h - 26) continue;
    if(x > cam.x - 6 && x < cam.x + W + 6 && y > cam.y - 6 && y < cam.y + H + 6) continue;
    return { x, y };
  }
  return {
    x: clamp(P.x + rand(-1, 1) * 340, 26, ARENA.w - 26),
    y: clamp(P.y + rand(-1, 1) * 220, 26, ARENA.h - 26)
  };
}

function addEnemy(type, px, py){
  const def = ENEMIES[type];
  if(!def) return;
  const t = state.time;
  /* 前 6 分钟和原来一致，后面的指数项封顶 26——否则 8 分钟后怪血 70 倍，完全打不动 */
  const hpMul = 1 + t * 0.0095 + Math.min(26, Math.pow(t / 60, 2.25) * 0.38);
  const spdMul = 1 + Math.min(0.95, t * 0.0016);
  const dmgMul = 1 + t * 0.0022 + Math.pow(t / 60, 1.9) * 0.055;
  const p = (px === undefined) ? spawnPoint() : { x:px, y:py };
  enemies.push({
    id: uid++,
    type, spr: def.spr, sc: def.sc || 1, big: false,
    x: p.x, y: p.y,
    hp: def.hp * hpMul * 0.72, maxHp: def.hp * hpMul * 0.72,
    speed: def.spd * spdMul * rand(0.92, 1.08),
    r: def.r, dmg: def.dmg * dmgMul * 1.80, slowT: 0,
    xp: Math.max(1, Math.round(def.xp * (1 + t / 180))),
    col: def.col, ai: def.ai || 'chase',
    alpha: def.alpha || 1, poison: !!def.poison, circleT: 0,
    flash:0, hitT:0, atkCd:0, banCd:0, seed: rand(0,10), anim:0,
    dashState:'walk', dashT: rand(1.2, 2.8), dashDir: 0, dashV: 0,
    dead:false
  });
}

function spawnMini(x, y){
  if(enemies.length >= 520) return;
  const t = state.time;
  const hpMul = 1 + t * 0.009 + Math.pow(t / 60, 1.9) * 0.30;
  enemies.push({
    id: uid++, type:'slime', spr:'slime', sc:0.62, big:false,
    x, y, hp: 7*hpMul, maxHp: 7*hpMul,
    speed: 48 * (1 + Math.min(0.4, t * 0.001)), slowT: 0,
    r: 3.8, dmg: 11 * (1 + t * 0.0035), xp: 1, col:'#7fe08a', ai:'chase',
    flash:0, hitT:0, atkCd:0, banCd:0, seed:rand(0,10), anim:0,
    dashState:'walk', dashT:1, dashDir:0, dashV:0, dead:false
  });
}

function spawnWave(){
  const t = state.time;
  /* 前期温和增长，4 分钟之后明显加压 */
  const n = 3 + Math.floor(t / 80) + Math.floor(Math.max(0, t - 200) / 22);
  for(let i = 0; i < n; i++){
    if(enemies.length >= 520) break;
    const ty = pickType();
    addEnemy(ty);
    if(ty === 'ant'){
      for(let k = 0; k < 2; k++){
        if(enemies.length >= 520) break;
        addEnemy('ant');
      }
    }
  }
  state.spawn = Math.max(0.26, 0.50 - t * 0.00060);
  /* 有 Boss 在场时刷怪放慢，否则子弹全打在杂兵身上，Boss 永远打不动 */
  if(state.bossAlive) state.spawn *= 3.2;
}

/* --- 怪潮：定期从四周包一圈，逼你动起来（不站在人堆里苟） --- */
function spawnHorde(){
  if(enemies.length >= 430) return;
  const t = state.time;
  const n = 10 + Math.floor(t / 50);
  const ty = pickType();
  for(let i = 0; i < n; i++){
    if(enemies.length >= 430) break;
    const a = (i / n) * TAU + rand(-0.08, 0.08);
    const d = rand(250, 330);
    addEnemy(ty, clamp(P.x + Math.cos(a) * d, 26, ARENA.w - 26),
                 clamp(P.y + Math.sin(a) * d, 26, ARENA.h - 26));
  }
  showToast('怪潮来袭！');
  rings.push({ x:P.x, y:P.y, r0:340, r1:250, life:0.7, max:0.7, col:'#ff8fb0', w:2 });
  sfx('boss');
}

/* --- 精英怪：5 分钟后开始刷，更硬更疼，掉一大坨经验 --- */
function spawnElite(){ spawnEliteAt(); }

function spawnEliteAt(x, y, type){
  if(enemies.length >= 500) return;
  addEnemy(type || pickType(), x, y);
  const e = enemies[enemies.length - 1];
  if(!e || e.big) return;
  e.elite = true;
  e.sc *= 1.7;
  e.r *= 1.5;
  e.hp = e.maxHp = e.maxHp * 9;
  e.dmg *= 1.8;
  e.xp = Math.round(e.xp * 7);
  addText(e.x, e.y - 22, '✦ 精英', '#ffd166', 12);
}

function spawnBoss(){
  const keys = ['candyKing', 'colaKing', 'burgerKing', 'jellyPope', 'veggieQueen', 'puddingTyrant'];
  const key = keys[state.bossIdx % keys.length];
  const def = BOSSES[key];
  const t = state.time;
  /* 跟玩家实际 DPS 走：2.5 分钟约 7.6 倍、5 分钟约 15 倍、8 分钟约 27 倍。
     之前的线性 3+0.11t 在 2.5 分钟就有 20 倍，配上满屏小怪抢伤害，boss 根本打不动 */
  /* 平滑曲线：随时间 + 随第几只缓慢递增，避免"这只很脆、下一只突然很肉" */
  const hpMul = (2.8 + Math.pow(t / 60, 1.45) * 1.30 + t * 0.030)
              * (1 + Math.min(6, state.bossIdx) * 0.09)
              * (state.bossIdx === 0 ? 0.62 : 1);
  const a = rand(0, TAU);
  const x = clamp(P.x + Math.cos(a) * 210, 40, ARENA.w - 40);
  const y = clamp(P.y + Math.sin(a) * 210, 40, ARENA.h - 40);
  enemies.push({
    id: uid++, type:'boss', bossType:key, name:def.name,
    spr:def.spr, sc:def.sc, big:true,
    x, y, hp:def.hp * hpMul, maxHp:def.hp * hpMul,
    speed: def.spd * (1 + Math.min(0.5, t * 0.0016)), slowT: 0, r: def.r, dmg: def.dmg * (1 + t * 0.0035), xp: def.xp,
    col: def.col, crown: def.crown, ai: def.ai,
    flash:0, hitT:0, atkCd:1.6, banCd:0, seed:rand(0,10), anim:0,
    dashState:'walk', dashT:3, dashDir:0, dashV:0, dashQueue: 0,
    spiral: 0, spiralA: 0, spiralT: 0, spiralDir: 1,
    skillCd: 2.0, skill2Cd: 4.6, phase: 0, dead:false
  });
  /* 登场震飞杂兵：不然满屏小怪会把所有自动索敌的伤害全吃掉，Boss 永远打不掉血 */
  let cleared = 0;
  for(let i = 0; i < enemies.length; i++){
    if(!enemies[i].big && !enemies[i].dead){ enemies[i].dead = true; cleared++; }
  }
  for(let r = 0; r < 3; r++){
    rings.push({ x, y, r0: 20 + r * 40, r1: 210 + r * 90, life: 0.55 + r * 0.12, max: 0.55 + r * 0.12,
      col: r === 0 ? '#ffffff' : def.col, w: 3 });
  }
  burst(x, y, '#fff6c8', 26, 220);
  if(cleared > 0) addText(x, y - 40, '杂兵被震飞！', '#ffe066', 12);

  state.bossIdx++;
  state.bossAt = state.time + 68;
  showToast(def.hint || ('⚠ ' + def.name + ' 出现了！'));
  sfx('boss');
  state.shake = 7;
  state.flash = 0.18;
}

/* --- 地面毒雾（玩家站进去会持续掉血） --- */
function addHazard(x, y, r, life, dmg){
  if(hazards.length >= 22) return;
  hazards.push({ x, y, r, life, max: life, dmg, tickT: 0.45, seed: rand(0, 10) });
}

/* --- 激光：沿一条线立刻结算伤害，再留 0.2 秒光柱 --- */
function fireBeam(x, y, ang, len, width, dmg, src){
  const prevSrc = SRC;
  if(src) SRC = src;
  beams.push({ x, y, ang, len, width, life: 0.2, max: 0.2, src: src || 'beam', col:'#ff7ae0' });
  const dx = Math.cos(ang), dy = Math.sin(ang);
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    const rx = e.x - x, ry = e.y - y;
    const t = rx * dx + ry * dy;
    if(t < -e.r || t > len + e.r) continue;
    const px = x + dx * clamp(t, 0, len);
    const py = y + dy * clamp(t, 0, len);
    if(dist(px, py, e.x, e.y) < width * 0.5 + e.r) hurt(e, dmg);
  }
  SRC = prevSrc;
}

/* --- 敌弹 --- */
function shootAt(x, y, tx, ty, spd, dmg, col, homing){
  if(ebullets.length > 300) return;
  const a = Math.atan2(ty - y, tx - x);
  ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r:4, dmg, col, life:4.5, homing: homing || 0 });
}
function shootRing(x, y, n, spd, dmg, col, off){
  if(ebullets.length > 300) return;
  for(let i = 0; i < n; i++){
    const a = (off || 0) + i * TAU / n;
    ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r:4.5, dmg, col, life:5.5, homing:0 });
  }
}

/* --- 自爆番茄 --- */
function enemySelfDestruct(e){
  e.dead = true;
  state.shake = Math.max(state.shake, 4.5);
  explode(e.x, e.y, 50, 26 + state.time * 0.05, '#ff8a5c');
  if(dist(e.x, e.y, P.x, P.y) < 50 + P.r) hurtPlayer(e.dmg + 12);
}

/* =========================================================
   11. 更新
   ========================================================= */
function updateGame(dt){
  state.time += dt;

  /* --- 玩家移动 --- */
  let mx = 0, my = 0;
  if(keys['a'] || keys['arrowleft'])  mx--;
  if(keys['d'] || keys['arrowright']) mx++;
  if(keys['w'] || keys['arrowup'])    my--;
  if(keys['s'] || keys['arrowdown'])  my++;
  if(mx || my){
    const l = Math.hypot(mx, my);
    mx /= l; my /= l;
    P.moving = true;
    P.anim += dt * (1 + Math.hypot(mx, my));
    if(mx > 0.1) P.facing = 1;
    else if(mx < -0.1) P.facing = -1;
  } else {
    P.moving = false;
    P.anim += dt * 0.4;
  }
  const spd = ST.speed;
  P.x = clamp(P.x + mx * spd * dt, 14, ARENA.w - 14);
  P.y = clamp(P.y + my * spd * dt, 14, ARENA.h - 14);

  if(P.invuln > 0) P.invuln -= dt;
  if(state.hurtFlash > 0) state.hurtFlash -= dt;
  if(state.flash > 0) state.flash -= dt * 3.2;
  if(state.slow > 0) state.slow -= dt;
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt * 20);
  if(state.shakeCd > 0) state.shakeCd -= dt;
  if(ST.regen > 0 && P.hp < P.maxHp){
    P.hp = Math.min(P.maxHp, P.hp + ST.regen * dt);
  }
  if(state.healBudget < ST.vampCap){
    state.healBudget = Math.min(ST.vampCap, state.healBudget + dt * ST.vampCap);
  }

  /* --- 相机 --- */
  const tx = clamp(P.x - W / 2, 0, ARENA.w - W);
  const ty = clamp(P.y - H / 2, 0, ARENA.h - H);
  const k = 1 - Math.pow(0.00001, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);

  /* --- 刷怪 --- */
  state.spawn -= dt;
  if(state.spawn <= 0) spawnWave();
  state.bossAlive = false;
  for(let i = 0; i < enemies.length; i++){ if(enemies[i].big && !enemies[i].dead){ state.bossAlive = true; break; } }
  if(state.time >= state.bossAt) spawnBoss();
  if(state.time >= state.eliteAt){ state.eliteAt = state.time + 26; spawnElite(); }
  if(state.time >= state.hordeAt){ state.hordeAt = state.time + rand(38, 54); spawnHorde(); }

  /* --- 血包补给 --- */
  state.dropTimer -= dt;
  if(state.dropTimer <= 0){
    state.dropTimer = rand(13, 18);
    if(drops.length < 3){
      const a = rand(0, TAU), d = rand(60, 165);
      dropHeal(clamp(P.x + Math.cos(a) * d, 30, ARENA.w - 30),
               clamp(P.y + Math.sin(a) * d, 30, ARENA.h - 30), 0.22);
    }
  }

  /* --- 武器开火 --- */
  for(const id in P.weapons){
    const w = WEAPONS[id];
    const lv = P.weapons[id];
    if(w.continuous) continue;
    P.cds[id] = (P.cds[id] === undefined ? 0.3 : P.cds[id]) - dt;
    if(P.cds[id] <= 0){
      w.fire(lv);
      P.cds[id] = w.stats(lv).cd * ST.cdMul * (ST.cbAmmo && (id === 'gun' || id === 'slipper' || id === 'f_ammo') ? 0.65 : 1);
    }
  }

  /* --- 技能道具：回响护符 / 磁暴线圈 --- */
  if(P.passives.echo){
    const el = P.passives.echo;
    P.echoT = (P.echoT === undefined ? 3 : P.echoT) - dt;
    if(P.echoT <= 0){
      P.echoT = Math.max(2.6, 6.4 - 1.2 * el);
      const R = (64 + 12 * el) * ST.area;
      explode(P.x, P.y, R, 18 + 14 * el + P.level * 2, '#9fe0ff', true, 'echo');
      rings.push({ x:P.x, y:P.y, r0:10, r1:R, life:0.32, max:0.32, col:'#9fe0ff', w:3 });
      burst(P.x, P.y, '#9fe0ff', 10, 150);
      sfx('bubble');
    }
  }
  if(P.passives.coil){
    const cl = P.passives.coil;
    P.coilT = (P.coilT === undefined ? 2 : P.coilT) - dt;
    if(P.coilT <= 0){
      P.coilT = Math.max(2.0, 5.2 - 0.8 * cl);
      const tg = nearestEnemy(P.x, P.y, 460);
      if(tg){
        strikes.push({ kind:'zap', x:tg.x, y:tg.y, delay:0.1, max:0.1,
          r:(24 + 6 * cl) * ST.area, dmg: 45 + 20 * cl + P.level * 3, seed: rand(0, 100) });
        sfx('zap');
      }
    }
  }

  /* --- 回旋香蕉（Lv.5 双环反向） --- */
  P.orbPos = [];
  const blv = P.weapons.banana || fusedLv('banana');
  if(blv){
    const s = WEAPONS.banana.stats(blv);
    P.orbAngle = (P.orbAngle || 0) + dt * s.rot;
    const dual = blv >= 5;
    const R = s.radius * ST.area * (ST.cbFlywheel ? 1.25 : 1);
    P.orbR = R;
    P.orbR2 = R * 0.64;
    P.orbDual = dual;
    const loops = dual ? 2 : 1;
    for(let r = 0; r < loops; r++){
      const dir = r === 0 ? 1 : -1;
      const rr = r === 0 ? R : R * 0.64;
      const cnt = s.count;
      for(let i = 0; i < cnt; i++){
        const a = P.orbAngle * dir + i * TAU / cnt + r * 0.55;
        const bx = P.x + Math.cos(a) * rr;
        const by = P.y + Math.sin(a) * rr;
        if(!P.orbPos) P.orbPos = [];
        if(P.orbPos.length < 24) P.orbPos.push({ x: bx, y: by, r: s.size + 2 });
        for(let j = 0; j < enemies.length; j++){
          const e = enemies[j];
          if(e.dead || e.banCd > 0) continue;
          /* 香蕉是"环"而不是"点"：只要敌人贴着这条轨道就算撞上（否则几乎打不到人） */
          if(Math.abs(dist(P.x, P.y, e.x, e.y) - rr) < s.size + e.r + 4){
            e.banCd = 0.3;
            SRC = 'banana';
            hurt(e, s.dmg * (dual ? 1.3 : 1));
            burst(bx, by, '#ffe066', 2, 70, 0);
          }
        }
      }
    }
  }

  /* --- 辣椒光环（持续范围伤害） --- */
  const alv = P.weapons.aura || fusedLv('aura');
  if(alv){
    const as = WEAPONS.aura.stats(alv);
    const evo = alv >= 5;
    const R = as.radius * ST.area * ST.blast * (evo ? 1.3 : 1);
    P.auraR = R;
    P.auraT = (P.auraT === undefined ? 0.2 : P.auraT) - dt;
    if(P.auraT <= 0){
      P.auraT = as.tick;
      P.auraPulse = 1;
      const dmg = as.dmg * (evo ? 1.5 : 1);
      for(let j = 0; j < enemies.length; j++){
        const e = enemies[j];
        if(e.dead) continue;
        if(dist(P.x, P.y, e.x, e.y) < R + e.r){
          SRC = 'aura';
          hurt(e, dmg);
          if(ST.cbVolt && !e.dead && Math.random() < 0.3){
            const t2 = nearestEnemy(e.x, e.y, 190, e.id);
            if(t2){
              SRC = 'aura';
              hurt(t2, dmg * 1.2);
              beams.push({ x:e.x, y:e.y, ang: Math.atan2(t2.y - e.y, t2.x - e.x),
                len: dist(e.x, e.y, t2.x, t2.y), width:2, life:0.12, max:0.12, col:'#9fe8ff', src:'aura' });
            }
          }
          if(evo && !e.dead){
            const a2 = Math.atan2(e.y - P.y, e.x - P.x);
            e.x += Math.cos(a2) * 8;
            e.y += Math.sin(a2) * 8;
          }
        }
      }
      if(evo && rings.length < 22){
        rings.push({ x:P.x, y:P.y, r0:R * 0.35, r1:R, life:0.28, max:0.28, col:'#ff8a3d', w:2 });
      }
    }
    if(P.auraPulse > 0) P.auraPulse -= dt * 3.6;
  }

  /* --- 玩家子弹 --- */
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += (b.spin || 0) * dt;
    if(b.homing){
      const tgt = nearestEnemy(b.x, b.y, 300);
      if(tgt){
        const want = Math.atan2(tgt.y - b.y, tgt.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let df = want - cur;
        while(df > Math.PI) df -= TAU;
        while(df < -Math.PI) df += TAU;
        const na = cur + clamp(df, -3.4 * dt, 3.4 * dt);
        const sp = Math.min(300, Math.hypot(b.vx, b.vy) + b.homing * dt);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    /* 射程：按累计飞行距离算，飞到头就地消散（不造成伤害） */
    b.trav = (b.trav || 0) + Math.hypot(b.vx, b.vy) * dt;
    if(b.range && b.trav > b.range){
      burst(b.x, b.y, b.col || '#ffe9c9', 2, 34, 0);
      bullets.splice(i, 1);
      continue;
    }
    if(b.life <= 0 || b.x < -30 || b.y < -30 || b.x > ARENA.w + 30 || b.y > ARENA.h + 30){
      bullets.splice(i, 1);
      continue;
    }
    let gone = false;
    for(let j = 0; j < enemies.length; j++){
      const e = enemies[j];
      if(e.dead || b.hitSet.has(e.id)) continue;
      const rr = b.r + e.r;
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy > rr*rr) continue;

      b.hitSet.add(e.id);
      SRC = b.src || 'misc';
      hurt(e, b.dmg);
      if(b.slow) e.slowT = Math.max(e.slowT || 0, b.slow);
      b.hitCount = (b.hitCount || 0) + 1;

      if(ST.knock > 0 && !e.big && !e.dead){
        const ka = Math.atan2(e.y - b.y, e.x - b.x) || 0;
        e.x = clamp(e.x + Math.cos(ka) * ST.knock, 8, ARENA.w - 8);
        e.y = clamp(e.y + Math.sin(ka) * ST.knock, 8, ARENA.h - 8);
        e.x -= b.vx * dt * 0.9; e.y -= b.vy * dt * 0.9;
      }
      if(b.boom) explode(b.x, b.y, b.boom, b.dmg * (b.boomMul === undefined ? 0.5 : b.boomMul), b.col || '#ffd166', false, b.src || 'misc');
      /* 爆米花导弹：炸开后再炸出 4 枚小导弹 */
      if(b.split && !b.splitDone){
        b.splitDone = true;
        for(let k = 0; k < b.split; k++){
          const a2 = (k / b.split) * TAU + rand(-0.2, 0.2);
          bullets.push({
            type:'missile', x:b.x, y:b.y,
            vx: Math.cos(a2) * 175, vy: Math.sin(a2) * 175,
            r:4, dmg: b.dmg * 0.45, life:1.5, pierce:0, homing:200,
            boom: b.boom * 0.6, hitSet:new Set(), hitCount:0,
            rot:a2, spin:0, col:'#ffe066', src:b.src, range: 210
          });
        }
      }

      if(b.type === 'candy'){
        b.bounces--;
        const nx = nearestEnemy(b.x, b.y, 220, e.id);
        if(b.bounces >= 0 && nx){
          const a = Math.atan2(nx.y - b.y, nx.x - b.x);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(a) * sp;
          b.vy = Math.sin(a) * sp;
          b.hitSet.clear();
          b.hitSet.add(e.id);
          burst(b.x, b.y, '#ffc2d6', 3, 60, 0);
        } else {
          gone = true;
        }
      } else if(b.hitCount > (b.pierce === undefined ? 0 : b.pierce)){
        gone = true;
      }
      if(gone) break;
    }
    if(gone){
      burst(b.x, b.y, '#ffe9c9', 3, 60, 0);
      bullets.splice(i, 1);
    }
  }

  /* --- 敌人 AI --- */
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    if(e.flash > 0) e.flash -= dt;
    if(e.hitT > 0) e.hitT -= dt;
    if(e.atkCd > 0) e.atkCd -= dt;
    if(e.banCd > 0) e.banCd -= dt;
    if(e.baseSpeed === undefined) e.baseSpeed = e.speed;
    if(e.slowT > 0){
      e.slowT -= dt;
      e.speed = e.baseSpeed * 0.30;
    } else if(e.speed !== e.baseSpeed){
      e.speed = e.baseSpeed;
    }
    updateEnemyAI(e, dt);
  }

  separate();
  applyContact(dt);

  let anyDead = false;
  for(let i = 0; i < enemies.length; i++) if(enemies[i].dead){ anyDead = true; break; }
  if(anyDead) enemies = enemies.filter(e => !e.dead);

  /* --- 敌弹 --- */
  if(state.orbCd > 0) state.orbCd -= dt;
  for(let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    if(state.orbCd <= 0 && P.orbPos && P.orbPos.length){
      let blocked = false;
      for(let k = 0; k < P.orbPos.length; k++){
        const o = P.orbPos[k];
        if(dist(o.x, o.y, b.x, b.y) < o.r + b.r){ blocked = true; break; }
      }
      if(blocked){
        burst(b.x, b.y, '#ffe066', 5, 80, 0);
        state.orbCd = 0.42;
        ebullets.splice(i, 1);
        continue;
      }
    }
    b.life -= dt;
    if(b.homing){
      const a = Math.atan2(P.y - b.y, P.x - b.x);
      let cur = Math.atan2(b.vy, b.vx);
      let diff = a - cur;
      while(diff > Math.PI) diff -= TAU;
      while(diff < -Math.PI) diff += TAU;
      const na = cur + clamp(diff, -b.homing * dt, b.homing * dt);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp;
      b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if(b.life <= 0 || b.x < -20 || b.y < -20 || b.x > ARENA.w + 20 || b.y > ARENA.h + 20){
      ebullets.splice(i, 1);
      continue;
    }
    if(dist(b.x, b.y, P.x, P.y) < b.r + P.r){
      hurtPlayer(b.dmg);
      burst(b.x, b.y, b.col, 5, 70, 0);
      ebullets.splice(i, 1);
    }
  }

  /* --- 经验宝石（必须靠近才能捡） --- */
  const pr = ST.pickup;
  for(let i = gems.length - 1; i >= 0; i--){
    const g = gems[i];
    g.life += dt;
    const d = dist(g.x, g.y, P.x, P.y);
    if(d < pr){
      const pull = 250 + (pr - d) * 10;
      const a = Math.atan2(P.y - g.y, P.x - g.x);
      g.vx = lerp(g.vx, Math.cos(a) * pull, 0.3);
      g.vy = lerp(g.vy, Math.sin(a) * pull, 0.3);
    } else {
      g.vx *= 0.9;
      g.vy *= 0.9;
    }
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    if(d < 13){
      gainXp(g.val);
      burst(g.x, g.y, g.col, 4, 55, 0);
      sfx('gem');
      gems.splice(i, 1);
    }
  }

  /* --- 血包 --- */
  for(let i = drops.length - 1; i >= 0; i--){
    const h = drops[i];
    h.life += dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.vx *= 0.9;
    h.vy *= 0.9;
    if(dist(h.x, h.y, P.x, P.y) < 15){
      const heal = P.maxHp * h.val;
      P.hp = Math.min(P.maxHp, P.hp + heal);
      addText(P.x, P.y - 22, '+' + Math.round(heal), '#8ee06b', 11);
      burst(h.x, h.y, '#8ee06b', 10, 100, 0);
      rings.push({ x:h.x, y:h.y, r0:4, r1:26, life:0.32, max:0.32, col:'#8ee06b', w:2 });
      sfx('gem');
      drops.splice(i, 1);
    }
  }

  /* --- 黑洞：把敌人往里吸 + 持续碾压 --- */
  for(let i = holes.length - 1; i >= 0; i--){
    const h = holes[i];
    h.life -= dt;
    h.acc = (h.acc || 0) - dt;
    if(h.life <= 0){
      if(h.evo) explode(h.x, h.y, h.r * 0.95, h.dmg * 5, '#b98cff', false, 'hole');
      holes.splice(i, 1);
      continue;
    }
    const tickNow = h.acc <= 0;
    if(tickNow) h.acc = h.tick;
    for(let j = 0; j < enemies.length; j++){
      const e = enemies[j];
      if(e.dead) continue;
      const d = dist(h.x, h.y, e.x, e.y);
      if(d > h.r) continue;
      const a = Math.atan2(h.y - e.y, h.x - e.x);
      /* Boss / 精英完全免疫牵引（否则会被钉在黑洞中心动不了） */
      const pull = e.big ? 0 : (1 - d / h.r) * 88 * dt;
      e.x += Math.cos(a) * pull;
      e.y += Math.sin(a) * pull;
      if(ST.cbZero) e.slowT = Math.max(e.slowT || 0, 0.5);
      if(tickNow){
        SRC = 'hole';
        hurt(e, h.dmg * (ST.cbZero ? 1.5 : 1));
      }
    }
  }

  /* --- 地雷 --- */
  for(let i = mines.length - 1; i >= 0; i--){
    const m = mines[i];
    m.arm -= dt;
    m.life -= dt;
    if(m.life <= 0){ mines.splice(i, 1); continue; }
    if(m.arm > 0) continue;
    /* 抛出去的地雷：引信一到自己炸（不用等怪踩） */
    if(m.fuse !== undefined){
      m.fuse -= dt;
      if(m.fuse <= 0){
        explode(m.x, m.y, m.boom, m.dmg, '#ff5f8f', true, 'mine');
        if(m.evo) addHazard(m.x, m.y, m.boom * 0.65, 2.0, 4);
        mines.splice(i, 1);
        continue;
      }
    }
    let trig = false;
    for(let j = 0; j < enemies.length; j++){
      const e = enemies[j];
      if(e.dead) continue;
      if(dist(m.x, m.y, e.x, e.y) < m.r + e.r){ trig = true; break; }
    }
    if(trig){
      explode(m.x, m.y, m.boom, m.dmg, '#ff5f8f', true, 'mine');
      if(m.evo) addHazard(m.x, m.y, m.boom * 0.65, 2.0, 4);
      mines.splice(i, 1);
    }
  }

  /* --- 毒雾 --- */
  for(let i = hazards.length - 1; i >= 0; i--){
    const h = hazards[i];
    h.life -= dt;
    h.tickT -= dt;
    if(h.tickT <= 0){
      h.tickT = 0.6;
      if(dist(h.x, h.y, P.x, P.y) < h.r + P.r) hurtPlayer(h.dmg);
    }
    if(h.life <= 0) hazards.splice(i, 1);
  }

  /* --- 激光光柱 --- */
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }

  /* --- 延迟技能（落雷 / 爆米花 / 泡泡） --- */
  for(let i = strikes.length - 1; i >= 0; i--){
    const s = strikes[i];
    s.delay -= dt;
    if(s.delay <= 0){
      if(s.kind === 'bomb'){
        SRC = 'popcorn';
        explode(s.x, s.y, s.r, s.dmg, '#ffe9b8');
      } else if(s.kind === 'bubble'){
        SRC = 'bubble';
        bubbleBoom(s.x, s.y, s.r, s.dmg);
      } else {
        for(let j = 0; j < enemies.length; j++){
          const e = enemies[j];
          if(e.dead) continue;
          SRC = 'bolt';
          if(dist(s.x, s.y, e.x, e.y) < s.r + e.r){
            hurt(e, s.dmg);
            e.flash = 0.12;
          }
        }
        rings.push({ x:s.x, y:s.y, r0:s.r*0.25, r1:s.r*1.7, life:0.28, max:0.28, col:'#ffe066', w:3 });
        burst(s.x, s.y, '#fff3a8', 12, 150);
        addShake(1.8);
      }
      strikes.splice(i, 1);
    }
  }

  /* --- 特效 --- */
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 240 * dt * (p.g === undefined ? 1 : p.g);
    p.vx *= 0.96;
  }
  for(let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.life -= dt;
    t.y -= 28 * dt;
    if(t.life <= 0) texts.splice(i, 1);
  }
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt;
    if(r.life <= 0) rings.splice(i, 1);
  }

  updateHUD();
}

/* --- 敌人行为 --- */
function updateEnemyAI(e, dt){
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);

  if(e.big){ bossAI(e, dt, d, ang); return; }

  switch(e.ai){
    case 'weave': {
      e.anim += dt * 5;
      const w = Math.sin(state.t * 7 + e.seed) * 0.55;
      e.x += Math.cos(ang + w) * e.speed * dt;
      e.y += Math.sin(ang + w) * e.speed * dt;
      break;
    }
    case 'dash': {
      e.anim += dt * 3;
      if(e.dashState === 'walk'){
        e.x += Math.cos(ang) * e.speed * dt;
        e.y += Math.sin(ang) * e.speed * dt;
        e.dashT -= dt;
        if(e.dashT <= 0 && d < 240){ e.dashState = 'wind'; e.dashT = 0.42; e.dashDir = ang; }
      } else if(e.dashState === 'wind'){
        e.dashT -= dt;
        e.dashDir = ang;
        e.x += Math.cos(e.dashDir) * e.speed * 0.12 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 0.12 * dt;
        if(Math.random() < 0.4) burst(e.x, e.y + e.r, '#ffb066', 1, 40, 0);
        if(e.dashT <= 0){ e.dashState = 'dash'; e.dashT = 0.42; }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(e.dashDir) * e.speed * 3.6 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 3.6 * dt;
        if(Math.random() < 0.6) burst(e.x, e.y, '#ffb066', 1, 30, 0);
        if(e.dashT <= 0){ e.dashState = 'walk'; e.dashT = rand(1.9, 3.0); }
      }
      break;
    }
    case 'ranged': {
      e.anim += dt * 2;
      if(d < 150){
        e.x -= Math.cos(ang) * e.speed * 0.9 * dt;
        e.y -= Math.sin(ang) * e.speed * 0.9 * dt;
      } else if(d > 215){
        e.x += Math.cos(ang) * e.speed * dt;
        e.y += Math.sin(ang) * e.speed * dt;
      } else {
        e.x += Math.cos(ang + Math.PI / 2) * e.speed * 0.75 * dt;
        e.y += Math.sin(ang + Math.PI / 2) * e.speed * 0.75 * dt;
      }
      if(e.atkCd <= 0 && d < 330){
        e.atkCd = 2.6 + rand(0, 0.9);
        shootAt(e.x, e.y - 2, P.x, P.y, 112, e.dmg * 0.8, '#ff4fd8', 0);
        burst(e.x, e.y - 4, '#ff4fd8', 5, 70, 0);
        sfx('shoot');
      }
      break;
    }
    case 'kamikaze': {
      e.anim += dt * 7;
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
      if(d < e.r + P.r + 9){ enemySelfDestruct(e); return; }
      break;
    }
    case 'ghost': {
      /* 幽灵：越近冲得越快，无法被地形挡 */
      e.anim += dt * 4;
      const boost = 1 + Math.max(0, (170 - d)) / 170 * 1.5;
      e.x += Math.cos(ang) * e.speed * boost * dt;
      e.y += Math.sin(ang) * e.speed * boost * dt;
      if(Math.random() < 0.22) burst(e.x + rand(-4, 4), e.y + rand(-4, 4), '#cfd6ff', 1, 18, -0.3);
      break;
    }
    case 'hop': {
      /* 青蛙：走两步蹦一次大跳 */
      e.anim += dt * 3;
      if(e.dashState === 'walk'){
        e.dashT -= dt;
        e.x += Math.cos(ang) * e.speed * 0.55 * dt;
        e.y += Math.sin(ang) * e.speed * 0.55 * dt;
        if(e.dashT <= 0){
          e.dashState = 'dash'; e.dashT = 0.32; e.dashDir = ang;
          burst(e.x, e.y + e.r, '#6fe0c8', 6, 70, 0);
        }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(e.dashDir) * e.speed * 5.4 * dt;
        e.y += Math.sin(e.dashDir) * e.speed * 5.4 * dt;
        if(e.dashT <= 0){ e.dashState = 'walk'; e.dashT = rand(0.7, 1.3); }
      }
      break;
    }
    case 'circle': {
      /* 蜜蜂：绕着玩家转圈，周期性俯冲 */
      e.anim += dt * 9;
      e.circleT = (e.circleT || 0) + dt;
      if(e.dashState === 'walk'){
        const tangent = ang + Math.PI / 2;
        const pull = d > 100 ? 1 : (d < 62 ? -0.7 : 0);
        e.x += (Math.cos(tangent) * 0.95 + Math.cos(ang) * pull) * e.speed * dt;
        e.y += (Math.sin(tangent) * 0.95 + Math.sin(ang) * pull) * e.speed * dt;
        if(e.circleT > 2.4){ e.circleT = 0; e.dashState = 'dash'; e.dashT = 0.45; }
      } else {
        e.dashT -= dt;
        e.x += Math.cos(ang) * e.speed * 2.4 * dt;
        e.y += Math.sin(ang) * e.speed * 2.4 * dt;
        if(e.dashT <= 0){ e.dashState = 'walk'; e.circleT = 0; }
      }
      break;
    }
    default: {
      e.anim += dt * 3;
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
      break;
    }
  }

  if(d < e.r + P.r - 1 && e.atkCd <= 0){
    e.atkCd = 0.9;
  }
  e.x = clamp(e.x, 10, ARENA.w - 10);
  e.y = clamp(e.y, 10, ARENA.h - 10);
}

/* --- BOSS 行为：每种都有独立技能组 --- */
function bossAI(e, dt, d, ang){
  e.anim += dt * 2;
  e.skillCd -= dt;
  if(e.skill2Cd !== undefined) e.skill2Cd -= dt;

  if(e.dashState === 'dash'){
    e.dashT -= dt;
    e.x += Math.cos(e.dashDir) * e.speed * 4.2 * dt;
    e.y += Math.sin(e.dashDir) * e.speed * 4.2 * dt;
    if(Math.random() < 0.7) burst(e.x, e.y, e.col, 1, 45, 0);
    if(e.dashT <= 0){
      /* 冲撞落地：布丁暴君会砸出冲击波 */
      if(e.bossType === 'puddingTyrant'){
        rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r * 4.2, life:0.42, max:0.42, col:'#ffd166', w:4 });
        burst(e.x, e.y, '#ffd166', 14, 165);
        state.shake = Math.max(state.shake, 3.5);
        if(dist(e.x, e.y, P.x, P.y) < e.r * 3.6) hurtPlayer(e.dmg * 0.7);
      }
      if(e.dashQueue > 0){
        e.dashQueue--;
        e.dashDir = Math.atan2(P.y - e.y, P.x - e.x);
        e.dashT = 0.34;
      } else {
        e.dashState = 'walk'; e.dashT = 1.2;
      }
    }
  } else {
    const keep = (e.bossType === 'veggieQueen' || e.bossType === 'colaKing') ? 125 : 0;
    if(d > keep + 10){
      e.x += Math.cos(ang) * e.speed * dt;
      e.y += Math.sin(ang) * e.speed * dt;
    } else if(keep){
      e.x -= Math.cos(ang) * e.speed * 0.55 * dt;
      e.y -= Math.sin(ang) * e.speed * 0.55 * dt;
    }
  }

  const seg = e.hp / e.maxHp;
  const rage = seg < 0.35 ? 1.8 : (seg < 0.65 ? 1.35 : 1);

  if(e.skillCd <= 0){
    if(e.bossType === 'candyKing'){
      /* 糖果大王：环形弹幕 + 扇形追击，半血后叫糖果球 */
      shootRing(e.x, e.y, 14, 118 * rage, e.dmg * 0.5, '#ff8fc7', rand(0, TAU));
      for(let i2 = 0; i2 < 5; i2++){
        const a2 = ang + (i2 - 2) * 0.22;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*178, vy:Math.sin(a2)*178, r:5, dmg:e.dmg*0.55, col:'#ff5fc0', life:4, homing:0 });
      }
      rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r*2.6, life:0.34, max:0.34, col:'#ff8fc7', w:3 });
      if(seg < 0.5){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = rand(0, TAU);
          addEnemy('pudding', clamp(e.x + Math.cos(a2)*80, 30, ARENA.w - 30), clamp(e.y + Math.sin(a2)*80, 30, ARENA.h - 30));
        }
      }
      e.skillCd = 2.7 / rage;
      sfx('zap');

    } else if(e.bossType === 'colaKing'){
      /* 可乐喷泉：螺旋弹幕（持续 2.2 秒旋转扫射），隔一次追加追踪罐 */
      e.spiral = 2.2;
      e.spiralA = rand(0, TAU);
      e.spiralT = 0;
      e.spiralDir = Math.random() < 0.5 ? 1 : -1;
      if(e.phase % 2 === 1){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = ang + (i2 - 1) * 0.5;
          ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*140, vy:Math.sin(a2)*140, r:5, dmg:e.dmg*0.6, col:'#ff6b6b', life:5, homing:1.8 });
        }
      }
      e.phase++;
      e.skillCd = (seg < 0.4 ? 2.8 : 3.6);
      sfx('zap');

    } else if(e.bossType === 'burgerKing'){
      /* 汉堡巨兽：叫小弟 / 冲撞 / 天降肉饼 三选一 */
      const mode = e.phase % 3;
      if(mode === 0){
        for(let i2 = 0; i2 < 3; i2++){
          const a2 = rand(0, TAU);
          addEnemy('burger', clamp(e.x + Math.cos(a2)*74, 30, ARENA.w - 30), clamp(e.y + Math.sin(a2)*74, 30, ARENA.h - 30));
        }
        showToast('汉堡巨兽叫来了小弟！');
      } else if(mode === 1){
        e.dashState = 'dash'; e.dashT = 0.62; e.dashDir = ang;
        sfx('boss');
      } else {
        for(let i2 = 0; i2 < 3; i2++){
          strikes.push({ kind:'bomb',
            x: clamp(P.x + rand(-70, 70), 20, ARENA.w - 20),
            y: clamp(P.y + rand(-60, 60), 20, ARENA.h - 20),
            delay:0.7, max:0.7, r:44, dmg:e.dmg*0.8, seed:rand(0,100) });
        }
        showToast('小心天降肉饼！');
      }
      e.phase++;
      e.skillCd = 3.0 / rage;

    } else if(e.bossType === 'jellyPope'){
      /* 果冻教皇：召唤精英怪（核心特色），半血后一次两只 */
      const n = seg < 0.5 ? 2 : 1;
      for(let i2 = 0; i2 < n; i2++){
        spawnEliteAt(clamp(e.x + rand(-110, 110), 30, ARENA.w - 30),
                     clamp(e.y + rand(-110, 110), 30, ARENA.h - 30), 'pudding');
      }
      showToast(seg < 0.5 ? '果冻教皇狂化了，一次叫两只精英！' : '果冻教皇召来了精英！');
      rings.push({ x:e.x, y:e.y, r0:e.r, r1:e.r*3.4, life:0.5, max:0.5, col:'#a0ffd0', w:4 });
      shootRing(e.x, e.y, 12, 104, e.dmg * 0.45, '#a0ffd0', rand(0, TAU));
      e.skillCd = 5.0 / rage;
      sfx('boss');

    } else if(e.bossType === 'puddingTyrant'){
      /* 布丁暴君：三连冲刺，每段落地砸冲击波 */
      e.dashState = 'dash';
      e.dashDir = ang;
      e.dashT = 0.42;
      e.dashQueue = 2;
      showToast('布丁暴君开始冲撞！');
      sfx('boss');
      e.skillCd = 4.4 / rage;

    } else {
      /* 蔬菜女王：追踪弹 + 给小弟回血 + 毒雾 */
      for(let i2 = 0; i2 < 5; i2++){
        const a2 = ang + (i2 - 2) * 0.3;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*150, vy:Math.sin(a2)*150, r:5, dmg:e.dmg*0.7, col:'#ff5fc0', life:4.6, homing:1.5 });
      }
      for(let i2 = 0; i2 < enemies.length; i2++){
        const o = enemies[i2];
        if(!o.dead && !o.big && dist(o.x, o.y, e.x, e.y) < 170){
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.35);
        }
      }
      if(e.phase % 2 === 1){
        addHazard(clamp(P.x + rand(-40, 40), 30, ARENA.w - 30),
                  clamp(P.y + rand(-30, 30), 30, ARENA.h - 30), 40, 4.5, e.dmg * 0.45);
      }
      e.phase++;
      e.skillCd = 3.0 / rage;
      sfx('zap');
    }
  }

  /* 可乐喷泉的螺旋弹幕：每 0.085 秒甩两发，角度持续旋转 */
  if(e.spiral > 0){
    e.spiral -= dt;
    e.spiralA += e.spiralDir * dt * 5.0;
    e.spiralT -= dt;
    if(e.spiralT <= 0){
      e.spiralT = 0.085;
      for(let k = 0; k < 2; k++){
        const a2 = e.spiralA + k * Math.PI;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a2)*152, vy:Math.sin(a2)*152, r:4, dmg:e.dmg*0.4, col:'#ffb0b0', life:5.5, homing:0 });
      }
    }
  }

  if(seg < 0.7 && e.skill2Cd <= 0){
    shootRing(e.x, e.y, 18, 105, e.dmg * 0.4, e.col, rand(0, TAU));
    e.skill2Cd = 6.0 / rage;
  }

  if(d < e.r + P.r && e.atkCd <= 0){
    e.atkCd = 0.85;
    hurtPlayer(e.dmg);
  }
  e.x = clamp(e.x, 12, ARENA.w - 12);
  e.y = clamp(e.y, 12, ARENA.h - 12);
}

/* 接触伤害：站在怪堆里会持续掉血，接触的怪越多掉得越快（不再被 1 秒无敌全挡住） */
function applyContact(dt){
  let sum = 0, n = 0;
  const touching = [];
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    if(dist(e.x, e.y, P.x, P.y) < e.r + P.r + 1){ sum += e.dmg; n++; touching.push(e); }
  }
  state.contactN = n;
  if(n === 0) return;

  /* 荆棘：贴身就持续反伤 */
  if(ST.thorns > 0){
    state.thornsT = (state.thornsT || 0) - dt;
    if(state.thornsT <= 0){
      state.thornsT = 0.35;
      const prev = SRC;
      SRC = 'thorns';
      for(let i = 0; i < touching.length; i++) hurt(touching[i], ST.thorns);
      SRC = prev;
    }
  }

  const ramp = Math.min(1, 0.42 + state.time / 240);
  const dps = Math.min(sum * 0.34, P.maxHp * 0.15) * ramp * (1 - (ST.armor || 0)) * (1 - (ST.dodge || 0));
  P.hp -= dps * dt;
  state.contactFx -= dt;
  if(state.contactFx <= 0){
    state.contactFx = 0.18;
    state.hurtFlash = Math.max(state.hurtFlash, 0.22);
    state.shake = Math.max(state.shake, 2.2);
    burst(P.x, P.y, '#ff6b8f', 3, 60, 0);
  }
  if(P.hp <= 0){
    P.hp = 0;
    gameOver();
  }
}

function separate(){
  const CELL = 26;
  const grid = new Map();
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    const key = ((e.x / CELL) | 0) + '_' + ((e.y / CELL) | 0);
    let arr = grid.get(key);
    if(!arr){ arr = []; grid.set(key, arr); }
    arr.push(e);
  }
  for(let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if(e.dead) continue;
    const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
    for(let ox = -1; ox <= 1; ox++){
      for(let oy = -1; oy <= 1; oy++){
        const arr = grid.get((cx + ox) + '_' + (cy + oy));
        if(!arr) continue;
        for(let k = 0; k < arr.length; k++){
          const o = arr[k];
          if(o === e || o.dead) continue;
          const dx = e.x - o.x, dy = e.y - o.y;
          const d2 = dx*dx + dy*dy;
          const mr = (e.r + o.r) * 0.85;
          if(d2 < mr * mr && d2 > 0.0001){
            const d = Math.sqrt(d2);
            const push = (mr - d) * 0.42;
            e.x += (dx / d) * push;
            e.y += (dy / d) * push;
          }
        }
      }
    }
  }
}

   12. 渲染
